openapi: 3.0.3

info:
  title: API Escaleta - Subsonic Festival
  description: >
    API encargada de gestionar la escaleta del festival Subsonic.
    Permite administrar las actuaciones o pases, sus horarios,
    los artistas participantes y los espacios donde se realizan.

    Escaleta consulta Espacios mediante GET /espacios/{idEspacio}
    y GET /espacios/disponibilidad al crear o cambiar actuaciones.
    Espacios, Front-end y Estadísticas consultan la programación.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Servidor local

tags:
  - name: Escaleta
    description: Gestión de la programación del festival

paths:

  /escaleta:
    get:
      tags:
        - Escaleta
      summary: Obtener la escaleta
      operationId: escalet_get_escaleta
      description: >
        Devuelve todas las actuaciones programadas en el festival.
        Se puede filtrar la escaleta por fecha, espacio o artista.
      parameters:
        - name: fecha
          in: query
          required: false
          description: Fecha por la que se quiere filtrar la escaleta
          schema:
            type: string
            format: date
            example: "2027-07-16"

        - name: idEspacio
          in: query
          required: false
          description: Identificador del espacio
          schema:
            type: integer
            format: int64
            example: 3

        - name: idArtista
          in: query
          required: false
          description: Identificador del artista
          schema:
            type: integer
            format: int64
            example: 8

      responses:
        '200':
          description: Escaleta obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actuacion'

        '400':
          description: Parámetros de búsqueda no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Escaleta
      summary: Crear una actuación
      operationId: escalet_post_escaleta
      description: >
        Consulta síncrona a espacios GET /espacios/{idEspacio} (operationId:
        espacios_get_espacios_idEspacio) para validar Espacio.estado y a espacios GET
        /espacios/disponibilidad (operationId: espacios_get_espacios_disponibilidad) con fecha,
        horaInicio y horaFin del ActuacionInput. Comprueba idEspacio y disponible antes de crear la
        actuación.

        Añade una nueva actuación o pase a la escaleta del festival.
      requestBody:
        required: true
        description: Atributos de la solicitud definidos en el esquema referenciado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActuacionInput'

      responses:
        '201':
          description: Actuación creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuacion'

        '400':
          description: Datos de la actuación no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Conflicto de horario en el espacio seleccionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '503':
          description: Servicio requerido no disponible; no se puede completar la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /escaleta/{idActuacion}:
    parameters:
      - name: idActuacion
        in: path
        required: true
        description: Identificador de la actuación
        schema:
          type: integer
          format: int64
          example: 12

    get:
      tags:
        - Escaleta
      summary: Obtener una actuación
      operationId: escalet_get_escaleta_idActuacion
      description: >
        Devuelve la información de una actuación concreta de la escaleta.
      responses:
        '200':
          description: Actuación encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuacion'

        '404':
          description: Actuación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Escaleta
      summary: Modificar una actuación
      operationId: escalet_put_escaleta_idActuacion
      description: >
        Consulta síncrona a espacios GET /espacios/{idEspacio} (operationId:
        espacios_get_espacios_idEspacio) y a espacios GET /espacios/disponibilidad (operationId:
        espacios_get_espacios_disponibilidad) con los nuevos idEspacio, fecha, horaInicio y horaFin.
        Excluye la propia actuación al detectar solapamientos.

        Modifica todos los datos de una actuación existente.
      requestBody:
        required: true
        description: Atributos de la solicitud definidos en el esquema referenciado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActuacionInput'

      responses:
        '200':
          description: Actuación modificada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuacion'

        '400':
          description: Datos no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Actuación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Conflicto con otra actuación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '503':
          description: Servicio requerido no disponible; no se puede completar la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Escaleta
      summary: Eliminar una actuación
      operationId: escalet_delete_escaleta_idActuacion
      description: >
        Elimina una actuación de la escaleta del festival.
      responses:
        '204':
          description: Actuación eliminada correctamente

        '404':
          description: Actuación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /escaleta/dia/{fecha}:
    get:
      tags:
        - Escaleta
      summary: Obtener actuaciones por día
      operationId: escalet_get_escaleta_dia_fecha
      description: >
        Devuelve todas las actuaciones programadas para una fecha concreta.
      parameters:
        - name: fecha
          in: path
          required: true
          description: Fecha del festival
          schema:
            type: string
            format: date
            example: "2027-07-16"

      responses:
        '200':
          description: Actuaciones obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actuacion'

        '400':
          description: Fecha no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /escaleta/espacio/{idEspacio}:
    get:
      tags:
        - Escaleta
      summary: Obtener actuaciones por espacio
      operationId: escalet_get_escaleta_espacio_idEspacio
      description: >
        Devuelve las actuaciones programadas en un espacio o escenario.
      parameters:
        - name: idEspacio
          in: path
          required: true
          description: Identificador del espacio
          schema:
            type: integer
            format: int64
            example: 3

      responses:
        '200':
          description: Actuaciones obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actuacion'

        '404':
          description: Espacio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /escaleta/artista/{idArtista}:
    get:
      tags:
        - Escaleta
      summary: Obtener actuaciones de un artista
      operationId: escalet_get_escaleta_artista_idArtista
      description: >
        Devuelve todas las actuaciones programadas para un artista.
      parameters:
        - name: idArtista
          in: path
          required: true
          description: Identificador del artista
          schema:
            type: integer
            format: int64
            example: 8

      responses:
        '200':
          description: Actuaciones obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actuacion'

        '404':
          description: Artista no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /escaleta/proximas:
    get:
      tags:
        - Escaleta
      summary: Obtener próximas actuaciones
      operationId: escalet_get_escaleta_proximas
      description: >
        Devuelve las próximas actuaciones del festival ordenadas
        cronológicamente.

      responses:
        '200':
          description: Próximas actuaciones obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actuacion'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /escaleta/{idActuacion}/horario:
    patch:
      tags:
        - Escaleta
      summary: Modificar el horario de una actuación
      operationId: escalet_patch_escaleta_idActuacion_horario
      description: >
        Consulta síncrona a espacios GET /espacios/disponibilidad (operationId:
        espacios_get_espacios_disponibilidad) con fecha, horaInicio y horaFin nuevos; conserva
        idEspacio de la actuación y excluye su propia franja al comprobar conflictos.

        Permite cambiar la fecha o las horas de una actuación
        sin modificar el resto de sus datos.

      parameters:
        - name: idActuacion
          in: path
          required: true
          description: Identificador de la actuación
          schema:
            type: integer
            format: int64
            example: 12

      requestBody:
        required: true
        description: Atributos de la solicitud definidos en el esquema referenciado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionHorario'

      responses:
        '200':
          description: Horario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuacion'

        '400':
          description: Horario no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Actuación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Conflicto con otra actuación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '503':
          description: Servicio requerido no disponible; no se puede completar la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /escaleta/{idActuacion}/espacio:
    patch:
      tags:
        - Escaleta
      summary: Cambiar el espacio de una actuación
      operationId: escalet_patch_escaleta_idActuacion_espacio
      description: >
        Consulta síncrona a espacios GET /espacios/{idEspacio} (operationId:
        espacios_get_espacios_idEspacio) y a espacios GET /espacios/disponibilidad (operationId:
        espacios_get_espacios_disponibilidad) para el idEspacio nuevo y el horario actual; exige
        estado activo y ausencia de solapamiento.

        Permite asignar una actuación a otro espacio o escenario.

      parameters:
        - name: idActuacion
          in: path
          required: true
          description: Identificador de la actuación
          schema:
            type: integer
            format: int64
            example: 12

      requestBody:
        required: true
        description: Atributos de la solicitud definidos en el esquema referenciado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionEspacio'

      responses:
        '200':
          description: Espacio actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actuacion'

        '400':
          description: Datos no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Actuación o espacio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: El espacio está ocupado en ese horario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '503':
          description: Servicio requerido no disponible; no se puede completar la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /escaleta/conflictos:
    get:
      tags:
        - Escaleta
      summary: Consultar conflictos de programación
      operationId: escalet_get_escaleta_conflictos
      description: >
        Devuelve posibles conflictos existentes en la escaleta,
        como actuaciones asignadas al mismo espacio en horarios
        incompatibles.

      responses:
        '200':
          description: Conflictos obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConflictoEscaleta'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:

  schemas:

    Actuacion:
      type: object
      description: Actuación programada dentro de la escaleta
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único de la actuación
          example: 12

        idArtista:
          type: integer
          format: int64
          description: Identificador del artista
          example: 8

        nombreArtista:
          type: string
          description: Nombre del artista o grupo
          example: "Arde Bogotá"

        idEspacio:
          type: integer
          format: int64
          description: Identificador del espacio donde se realiza
          example: 3

        nombreEspacio:
          type: string
          description: Nombre del espacio o escenario
          example: "Escenario Principal"

        fecha:
          type: string
          format: date
          description: Fecha de la actuación
          example: "2027-07-16"

        horaInicio:
          type: string
          format: time
          description: Hora de inicio
          example: "21:30:00"

        horaFin:
          type: string
          format: time
          description: Hora de finalización
          example: "23:00:00"

        estado:
          type: string
          description: Estado actual de la actuación
          enum:
            - programada
            - en_curso
            - finalizada
            - cancelada
          example: "programada"

      required:
        - id
        - idArtista
        - nombreArtista
        - idEspacio
        - nombreEspacio
        - fecha
        - horaInicio
        - horaFin
        - estado


    ActuacionInput:
      type: object
      description: Datos necesarios para crear o modificar una actuación
      properties:
        idArtista:
          type: integer
          format: int64
          description: Identificador del artista
          example: 8

        idEspacio:
          type: integer
          format: int64
          description: Identificador del espacio
          example: 3

        fecha:
          description: Fecha del evento o del registro, en formato ISO 8601 (AAAA-MM-DD).
          type: string
          format: date
          example: "2027-07-16"

        horaInicio:
          description: Hora local de inicio en formato HH:MM:SS.
          type: string
          format: time
          example: "21:30:00"

        horaFin:
          description: Hora local de finalización en formato HH:MM:SS.
          type: string
          format: time
          example: "23:00:00"

        estado:
          description: Estado actual del recurso según los valores enumerados.
          type: string
          enum:
            - programada
            - en_curso
            - finalizada
            - cancelada
          example: "programada"

      required:
        - idArtista
        - idEspacio
        - fecha
        - horaInicio
        - horaFin


    ActualizacionHorario:
      type: object
      description: Datos necesarios para modificar el horario de una actuación
      properties:
        fecha:
          description: Fecha del evento o del registro, en formato ISO 8601 (AAAA-MM-DD).
          type: string
          format: date
          example: "2027-07-17"

        horaInicio:
          description: Hora local de inicio en formato HH:MM:SS.
          type: string
          format: time
          example: "22:00:00"

        horaFin:
          description: Hora local de finalización en formato HH:MM:SS.
          type: string
          format: time
          example: "23:30:00"

      required:
        - fecha
        - horaInicio
        - horaFin


    ActualizacionEspacio:
      type: object
      description: Datos necesarios para cambiar el espacio de una actuación
      properties:
        idEspacio:
          type: integer
          format: int64
          description: Nuevo espacio asignado a la actuación
          example: 5

      required:
        - idEspacio


    ConflictoEscaleta:
      type: object
      description: Conflicto detectado en la programación
      properties:
        idActuacion1:
          description: Identificador de la primera actuación en conflicto.
          type: integer
          format: int64
          example: 12

        idActuacion2:
          description: Identificador de la segunda actuación en conflicto.
          type: integer
          format: int64
          example: 15

        idEspacio:
          description: Identificador del espacio gestionado por Espacios.
          type: integer
          format: int64
          example: 3

        descripcion:
          description: Texto descriptivo del recurso.
          type: string
          example: "Las dos actuaciones coinciden en el mismo espacio y horario."

      required:
        - idActuacion1
        - idActuacion2
        - idEspacio
        - descripcion


    Error:
      type: object
      description: Información sobre un error producido en la API
      properties:
        codigo:
          description: Código HTTP del error.
          type: integer
          format: int64
          example: 404

        mensaje:
          description: Texto explicativo del resultado o del error.
          type: string
          example: "Actuación no encontrada"

      required:
        - codigo
        - mensaje
