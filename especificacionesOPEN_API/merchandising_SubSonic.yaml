openapi: 3.0.3

info:
  title: API Merchandising - Subsonic Festival
  description: >
    API encargada de gestionar los productos de merchandising
    de Subsonic Festival, incluyendo el catálogo de productos,
    el stock disponible y las compras realizadas por los usuarios.

    Merchandising consulta Usuarios para validar al comprador y su
    método de pago. Front-end consume el catálogo y Estadísticas
    consume los datos de compras por usuario.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Servidor local

tags:
  - name: Productos
    description: Gestión de productos de merchandising

  - name: Compras
    description: Gestión de compras de merchandising

  - name: Stock
    description: Gestión del stock de productos


paths:

  /merchandising:
    get:
      tags:
        - Productos
      summary: Obtener productos de merchandising
      operationId: merchandising_get_merchandising
      description: >
        Devuelve todos los productos de merchandising disponibles.
        Permite filtrar los productos por categoría y disponibilidad.

      parameters:
        - name: categoria
          in: query
          required: false
          description: Categoría del producto
          schema:
            type: string
            enum:
              - camiseta
              - sudadera
              - accesorio
              - poster
              - otros
            example: camiseta

        - name: disponible
          in: query
          required: false
          description: Indica si se quieren mostrar únicamente productos disponibles
          schema:
            type: boolean
            example: true

      responses:
        '200':
          description: Productos obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'

        '400':
          description: Parámetros de búsqueda no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    post:
      tags:
        - Productos
      summary: Crear un producto
      operationId: merchandising_post_merchandising
      description: >
        Añade un nuevo producto al catálogo de merchandising
        de Subsonic Festival.

      requestBody:
        required: true
        description: Atributos de la solicitud definidos en el esquema referenciado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'

      responses:
        '201':
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'

        '400':
          description: Datos del producto no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Ya existe un producto con esos datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /merchandising/{idProducto}:
    parameters:
      - name: idProducto
        in: path
        required: true
        description: Identificador del producto
        schema:
          type: integer
          format: int64
          example: 15

    get:
      tags:
        - Productos
      summary: Obtener un producto
      operationId: merchandising_get_merchandising_idProducto
      description: >
        Devuelve la información de un producto de merchandising concreto.

      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'

        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    put:
      tags:
        - Productos
      summary: Modificar un producto
      operationId: merchandising_put_merchandising_idProducto
      description: >
        Modifica los datos de un producto existente.

      requestBody:
        required: true
        description: Atributos de la solicitud definidos en el esquema referenciado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'

      responses:
        '200':
          description: Producto modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'

        '400':
          description: Datos del producto no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    delete:
      tags:
        - Productos
      summary: Eliminar un producto
      operationId: merchandising_delete_merchandising_idProducto
      description: >
        Elimina un producto del catálogo de merchandising.

      responses:
        '204':
          description: Producto eliminado correctamente

        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: El producto no puede eliminarse porque tiene compras asociadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /merchandising/disponibles:
    get:
      tags:
        - Productos
      summary: Obtener productos disponibles
      operationId: merchandising_get_merchandising_disponibles
      description: >
        Devuelve los productos que tienen unidades disponibles
        para su compra.

      responses:
        '200':
          description: Productos disponibles obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /merchandising/{idProducto}/stock:
    get:
      tags:
        - Stock
      summary: Consultar stock de un producto
      operationId: merchandising_get_merchandising_idProducto_stock
      description: >
        Devuelve el número de unidades disponibles de un producto.

      parameters:
        - name: idProducto
          description: Identificador del producto gestionado por Merchandising.
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 15

      responses:
        '200':
          description: Stock obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'

        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    patch:
      tags:
        - Stock
      summary: Actualizar stock de un producto
      operationId: merchandising_patch_merchandising_idProducto_stock
      description: >
        Permite modificar el número de unidades disponibles
        de un producto.

      parameters:
        - name: idProducto
          description: Identificador del producto gestionado por Merchandising.
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 15

      requestBody:
        required: true
        description: Atributos de la solicitud definidos en el esquema referenciado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionStock'

      responses:
        '200':
          description: Stock actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'

        '400':
          description: Cantidad de stock no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /merchandising/compras:
    post:
      tags:
        - Compras
      summary: Comprar merchandising
      operationId: merchandising_post_merchandising_compras
      description: >
        Consulta síncrona a usuarios GET /usuarios/{idUsuario} (operationId:
        usuarios_get_usuarios_idUsuario) y a usuarios GET /usuarios/{idUsuario}/metodos-pago
        (operationId: usuarios_get_usuarios_idUsuario_metodos_pago). Comprueba Usuario.id y
        MetodoPago.id frente a idUsuario e idMetodoPago; después valida Producto.stock y devuelve
        CompraMerchandising. Cada petición compra un único idProducto. El cobro externo no figura en
        estos contratos.

        Permite a un usuario comprar una cantidad de un único
        producto de merchandising por solicitud.

      requestBody:
        required: true
        description: Atributos de la solicitud definidos en el esquema referenciado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraMerchandisingInput'

      responses:
        '201':
          description: Compra realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraMerchandising'

        '400':
          description: Datos de compra no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Usuario o producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: No hay suficiente stock disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '503':
          description: Servicio requerido no disponible; no se puede completar la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /merchandising/compras/{idCompra}:
    get:
      tags:
        - Compras
      summary: Consultar una compra
      operationId: merchandising_get_merchandising_compras_idCompra
      description: >
        Devuelve los datos de una compra de merchandising.

      parameters:
        - name: idCompra
          description: Identificador único de la compra.
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 245

      responses:
        '200':
          description: Compra obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraMerchandising'

        '404':
          description: Compra no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /merchandising/usuarios/{idUsuario}/compras:
    get:
      tags:
        - Compras
      summary: Obtener compras de un usuario
      operationId: merchandising_get_merchandising_usuarios_idUsuario_compras
      description: >
        Consulta síncrona a usuarios GET /usuarios/{idUsuario} (operationId:
        usuarios_get_usuarios_idUsuario) para confirmar idUsuario antes de devolver sus
        CompraMerchandising.

        Devuelve todas las compras de merchandising realizadas
        por un usuario.

      parameters:
        - name: idUsuario
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: integer
            format: int64
            example: 25

      responses:
        '200':
          description: Compras obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompraMerchandising'

        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '503':
          description: Servicio requerido no disponible; no se puede completar la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /merchandising/compras/{idCompra}/cancelar:
    patch:
      tags:
        - Compras
      summary: Cancelar una compra
      operationId: merchandising_patch_merchandising_compras_idCompra_cancelar
      description: >
        Permite cancelar una compra de merchandising
        siempre que todavía pueda ser cancelada.

      parameters:
        - name: idCompra
          description: Identificador único de la compra.
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 245

      responses:
        '200':
          description: Compra cancelada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraMerchandising'

        '404':
          description: Compra no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: La compra no puede ser cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:

  schemas:

    Producto:
      type: object
      description: Producto de merchandising de Subsonic Festival
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único del producto
          example: 15

        nombre:
          description: Nombre visible del recurso.
          type: string
          example: "Camiseta Subsonic 2027"

        descripcion:
          description: Texto descriptivo del recurso.
          type: string
          example: "Camiseta oficial de Subsonic Festival 2027"

        categoria:
          description: Categoría del producto de merchandising.
          type: string
          enum:
            - camiseta
            - sudadera
            - accesorio
            - poster
            - otros
          example: camiseta

        precio:
          description: Precio unitario en euros.
          type: number
          format: double
          minimum: 0
          example: 24.99

        stock:
          description: Unidades disponibles del producto.
          type: integer
          format: int64
          minimum: 0
          example: 350

        imagen:
          description: Ruta de la imagen del producto.
          type: string
          example: "/imagenes/merchandising/camiseta2027.jpg"

        disponible:
          description: Indica si el recurso está disponible.
          type: boolean
          example: true

      required:
        - id
        - nombre
        - categoria
        - precio
        - stock
        - disponible


    ProductoInput:
      type: object
      description: Datos necesarios para crear o modificar un producto
      properties:
        nombre:
          description: Nombre visible del recurso.
          type: string
          example: "Camiseta Subsonic 2027"

        descripcion:
          description: Texto descriptivo del recurso.
          type: string
          example: "Camiseta oficial del festival"

        categoria:
          description: Categoría del producto de merchandising.
          type: string
          enum:
            - camiseta
            - sudadera
            - accesorio
            - poster
            - otros
          example: camiseta

        precio:
          description: Precio unitario en euros.
          type: number
          format: double
          minimum: 0
          example: 24.99

        stock:
          description: Unidades disponibles del producto.
          type: integer
          format: int64
          minimum: 0
          example: 350

        imagen:
          description: Ruta de la imagen del producto.
          type: string
          example: "/imagenes/merchandising/camiseta2027.jpg"

      required:
        - nombre
        - categoria
        - precio
        - stock


    Stock:
      type: object
      description: Información de stock de un producto
      properties:
        idProducto:
          description: Identificador del producto gestionado por Merchandising.
          type: integer
          format: int64
          example: 15

        stock:
          description: Unidades disponibles del producto.
          type: integer
          format: int64
          minimum: 0
          example: 350

        disponible:
          description: Indica si el recurso está disponible.
          type: boolean
          example: true

      required:
        - idProducto
        - stock
        - disponible


    ActualizacionStock:
      type: object
      description: Nuevo stock disponible para un producto
      properties:
        stock:
          description: Unidades disponibles del producto.
          type: integer
          format: int64
          minimum: 0
          example: 400

      required:
        - stock


    CompraMerchandisingInput:
      type: object
      description: Datos necesarios para comprar un producto
      properties:
        idUsuario:
          description: Identificador del usuario gestionado por Usuarios.
          type: integer
          format: int64
          example: 25

        idProducto:
          description: Identificador del producto gestionado por Merchandising.
          type: integer
          format: int64
          example: 15

        cantidad:
          description: Número de unidades solicitadas o compradas.
          type: integer
          format: int64
          minimum: 1
          example: 2

        talla:
          description: Talla elegida para la prenda, cuando procede.
          type: string
          nullable: true
          enum:
            - XS
            - S
            - M
            - L
            - XL
            - XXL
          example: M

        idMetodoPago:
          description: Identificador del método de pago del usuario gestionado por Usuarios.
          type: integer
          format: int64
          example: 4

      required:
        - idUsuario
        - idProducto
        - cantidad
        - idMetodoPago


    CompraMerchandising:
      type: object
      description: Compra de merchandising realizada por un usuario
      properties:
        idCompra:
          description: Identificador único de la compra en este servicio.
          type: integer
          format: int64
          example: 245

        idUsuario:
          description: Identificador del usuario gestionado por Usuarios.
          type: integer
          format: int64
          example: 25

        idProducto:
          description: Identificador del producto gestionado por Merchandising.
          type: integer
          format: int64
          example: 15

        cantidad:
          description: Número de unidades solicitadas o compradas.
          type: integer
          format: int64
          example: 2

        talla:
          description: Talla elegida para la prenda, cuando procede.
          type: string
          nullable: true
          example: M

        precioTotal:
          description: Importe total de la compra en euros.
          type: number
          format: double
          example: 49.98

        fechaCompra:
          description: Fecha y hora de la compra en formato ISO 8601.
          type: string
          format: date-time
          example: "2027-07-10T16:35:00Z"

        estado:
          description: Estado actual del recurso según los valores enumerados.
          type: string
          enum:
            - realizada
            - preparada
            - entregada
            - cancelada
          example: realizada

      required:
        - idCompra
        - idUsuario
        - idProducto
        - cantidad
        - precioTotal
        - fechaCompra
        - estado


    Error:
      type: object
      description: Información sobre un error producido en la API
      properties:
        codigo:
          description: Código HTTP del error.
          type: integer
          format: int64
          example: 404

        mensaje:
          description: Texto explicativo del resultado o del error.
          type: string
          example: "Producto no encontrado"

      required:
        - codigo
        - mensaje


