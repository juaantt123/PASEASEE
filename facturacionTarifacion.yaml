openapi: 3.0.3

info:
  title: API de Usuarios - Polideportivo PASE
  version: '1'
  description: >
    API encargada de gestionar los usuarios del polideportivo,
    incluyendo registro, inicio de sesión, perfiles, socios,
    entidades deportivas y roles.

servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/escuelapolitecnica-397/PASEASSE/1
  - url: http://localhost:8080/api


paths:

  /auth/registro:
    post:
      summary: Registrar un nuevo usuario
      description: Crea una nueva cuenta de visitante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuario'

      responses:
        '201':
          description: Usuario creado correctamente

        '400':
          description: Datos incorrectos

        '409':
          description: El correo ya está registrado


  /auth/login:
    post:
      summary: Iniciar sesión
      description: Autentica al usuario y devuelve un token de sesión.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'

      responses:
        '200':
          description: Inicio de sesión correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLogin'

        '401':
          description: Credenciales incorrectas


  /usuarios/{id}:
    get:
      summary: Consultar un usuario

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

        '404':
          description: Usuario no encontrado


    put:
      summary: Modificar un usuario

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificarUsuario'

      responses:
        '200':
          description: Usuario modificado correctamente

        '400':
          description: Datos incorrectos

        '404':
          description: Usuario no encontrado


  /usuarios/{id}/tipo:
    get:
      summary: Consultar el tipo de usuario
      description: Devuelve el rol, estado de cuenta y nivel de descuento.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Tipo de usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoUsuario'

        '404':
          description: Usuario no encontrado


  /usuarios/{id}/datos-fiscales:
    get:
      summary: Consultar los datos fiscales de un usuario

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Datos fiscales obtenidos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatosFiscales'

        '404':
          description: Usuario no encontrado


  /socios:
    post:
      summary: Dar de alta a un socio
      description: Crea la membresía de un usuario.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Membresia'

      responses:
        '201':
          description: Socio creado correctamente

        '400':
          description: Datos incorrectos


  /socios/{id}:
    put:
      summary: Modificar la membresía de un socio

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Membresia'

      responses:
        '200':
          description: Membresía modificada correctamente

        '404':
          description: Socio no encontrado


  /entidades:
    post:
      summary: Dar de alta una entidad deportiva

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntidadDeportiva'

      responses:
        '201':
          description: Entidad deportiva creada correctamente

        '400':
          description: Datos incorrectos


  /roles:
    get:
      summary: Consultar roles

      responses:
        '200':
          description: Lista de roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rol'


  /roles/{id}/permisos:
    put:
      summary: Modificar los permisos de un rol

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permisos'

      responses:
        '200':
          description: Permisos modificados correctamente

        '404':
          description: Rol no encontrado


components:

  schemas:

    RegistroUsuario:
      type: object

      required:
        - nombre
        - apellidos
        - email
        - password

      properties:

        nombre:
          type: string
          example: Javier

        apellidos:
          type: string
          example: López Rodríguez

        email:
          type: string
          format: email
          example: javier@email.com

        telefono:
          type: string
          example: "600123456"

        password:
          type: string
          format: password

        consentimientoDatos:
          type: boolean
          example: true


    Login:
      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          example: javier@email.com

        password:
          type: string
          format: password


    RespuestaLogin:
      type: object

      properties:

        token:
          type: string
          example: abc123token

        rol:
          type: string
          example: socio


    Usuario:
      type: object

      properties:

        idUsuario:
          type: integer
          example: 1

        nombre:
          type: string
          example: Javier

        apellidos:
          type: string
          example: López Rodríguez

        email:
          type: string
          format: email

        telefono:
          type: string

        rol:
          type: string
          enum:
            - visitante
            - socio
            - entrenador_monitor
            - arbitro
            - administrador
            - entidad_deportiva

        estadoCuenta:
          type: string
          enum:
            - activa
            - pendiente_verificacion
            - suspendida
            - baja

        fechaAlta:
          type: string
          format: date

        consentimientoDatos:
          type: boolean


    ModificarUsuario:
      type: object

      properties:

        nombre:
          type: string

        apellidos:
          type: string

        telefono:
          type: string

        email:
          type: string
          format: email


    TipoUsuario:
      type: object

      properties:

        rol:
          type: string
          example: socio

        estadoCuenta:
          type: string
          example: activa

        nivelDescuento:
          type: number
          example: 10


    DatosFiscales:
      type: object

      properties:

        nifCif:
          type: string
          example: "12345678A"

        direccionFiscal:
          type: string
          example: "Calle Principal 10"


    Membresia:
      type: object

      properties:

        idMembresia:
          type: integer
          example: 1

        idUsuario:
          type: integer
          example: 15

        numeroSocio:
          type: string
          example: SOC-0015

        tipoCuota:
          type: string
          example: mensual

        estado:
          type: string
          enum:
            - activa
            - impagada
            - baja

        fechaInicio:
          type: string
          format: date

        fechaFin:
          type: string
          format: date

        nivelDescuento:
          type: number
          example: 10


    EntidadDeportiva:
      type: object

      properties:

        idEntidad:
          type: integer

        idUsuario:
          type: integer

        nombre:
          type: string
          example: Club Deportivo PASE

        cif:
          type: string
          example: B12345678

        direccionFiscal:
          type: string

        representanteLegal:
          type: string

        convenioVigente:
          type: boolean
          example: true


    Rol:
      type: object

      properties:

        idRol:
          type: integer

        nombre:
          type: string
          example: socio

        permisos:
          type: array
          items:
            type: string


    Permisos:
      type: object

      properties:

        permisos:
          type: array
          items:
            type: string

          example:
            - CONSULTAR_ESPACIOS
            - CREAR_RESERVA
            - CONSULTAR_RESERVAS