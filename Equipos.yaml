openapi: 3.0.3

info:
  title: API Equipos y Participantes - Polideportivo PASE
  description: >
    API encargada de gestionar los equipos internos del polideportivo,
    sus participantes, capitanes y la inscripción de equipos en competiciones.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Equipos
    description: Gestión de equipos internos
  - name: Participantes
    description: Gestión de los socios que forman parte de los equipos
  - name: Inscripciones
    description: Gestión de las inscripciones de equipos en competiciones

paths:

  /equipos:
    get:
      tags:
        - Equipos
      summary: Obtener todos los equipos
      responses:
        '200':
          description: Lista de equipos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipo'

    post:
      tags:
        - Equipos
      summary: Crear un nuevo equipo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearEquipo'
      responses:
        '201':
          description: Equipo creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipo'
        '400':
          description: Datos incorrectos
        '409':
          description: Ya existe un equipo con ese nombre

  /equipos/{idEquipo}:
    parameters:
      - name: idEquipo
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Equipos
      summary: Obtener un equipo por su identificador
      responses:
        '200':
          description: Equipo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipo'
        '404':
          description: Equipo no encontrado

    put:
      tags:
        - Equipos
      summary: Modificar un equipo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEquipo'
      responses:
        '200':
          description: Equipo modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipo'
        '404':
          description: Equipo no encontrado

    delete:
      tags:
        - Equipos
      summary: Eliminar un equipo
      responses:
        '204':
          description: Equipo eliminado correctamente
        '404':
          description: Equipo no encontrado

  /equipos/{idEquipo}/participantes:
    parameters:
      - name: idEquipo
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Participantes
      summary: Obtener los participantes de un equipo
      responses:
        '200':
          description: Lista de participantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participante'
        '404':
          description: Equipo no encontrado

    post:
      tags:
        - Participantes
      summary: Añadir un socio a un equipo
      description: >
        El usuario indicado debe existir en el componente Usuarios
        y tener el rol de socio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoParticipante'
      responses:
        '201':
          description: Participante añadido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participante'
        '400':
          description: El usuario no es un socio válido
        '404':
          description: Equipo o usuario no encontrado
        '409':
          description: El socio ya pertenece al equipo

  /equipos/{idEquipo}/participantes/{idUsuario}:
    parameters:
      - name: idEquipo
        in: path
        required: true
        schema:
          type: integer
      - name: idUsuario
        in: path
        required: true
        schema:
          type: integer

    delete:
      tags:
        - Participantes
      summary: Eliminar un participante de un equipo
      responses:
        '204':
          description: Participante eliminado correctamente
        '404':
          description: Equipo o participante no encontrado

  /equipos/{idEquipo}/capitan:
    put:
      tags:
        - Equipos
      summary: Asignar el capitán de un equipo
      parameters:
        - name: idEquipo
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idUsuario
              properties:
                idUsuario:
                  type: integer
                  example: 25
      responses:
        '200':
          description: Capitán asignado correctamente
        '400':
          description: El usuario no pertenece al equipo
        '404':
          description: Equipo o usuario no encontrado

  /inscripciones:
    post:
      tags:
        - Inscripciones
      summary: Inscribir un equipo en una competición
      description: >
        Inscribe un equipo en una competición gestionada por Escaleta.
        El pago de la inscripción será gestionado por Facturación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearInscripcion'
      responses:
        '201':
          description: Inscripción creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscripcion'
        '400':
          description: Datos de inscripción incorrectos
        '404':
          description: Equipo o competición no encontrados
        '409':
          description: El equipo ya está inscrito en la competición

  /equipos/{idEquipo}/inscripciones:
    get:
      tags:
        - Inscripciones
      summary: Consultar las competiciones en las que está inscrito un equipo
      parameters:
        - name: idEquipo
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inscripciones del equipo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inscripcion'
        '404':
          description: Equipo no encontrado


components:

  schemas:

    Equipo:
      type: object
      properties:
        idEquipo:
          type: integer
          example: 1
        nombre:
          type: string
          example: Los Halcones
        deporte:
          type: string
          example: Fútbol sala
        idCapitan:
          type: integer
          nullable: true
          example: 25
        fechaCreacion:
          type: string
          format: date
          example: 2026-09-28
        estado:
          type: string
          enum:
            - activo
            - inactivo
          example: activo

    CrearEquipo:
      type: object
      required:
        - nombre
        - deporte
      properties:
        nombre:
          type: string
          example: Los Halcones
        deporte:
          type: string
          example: Fútbol sala

    ActualizarEquipo:
      type: object
      properties:
        nombre:
          type: string
          example: Halcones FC
        deporte:
          type: string
          example: Fútbol sala
        estado:
          type: string
          enum:
            - activo
            - inactivo

    Participante:
      type: object
      properties:
        idEquipo:
          type: integer
          example: 1
        idUsuario:
          type: integer
          description: Identificador del socio en el componente Usuarios
          example: 25
        rolEnEquipo:
          type: string
          enum:
            - jugador
            - capitan
          example: jugador
        fechaIncorporacion:
          type: string
          format: date
          example: 2026-09-28

    NuevoParticipante:
      type: object
      required:
        - idUsuario
      properties:
        idUsuario:
          type: integer
          description: Identificador del socio que se añade al equipo
          example: 25

    CrearInscripcion:
      type: object
      required:
        - idEquipo
        - idCompeticion
      properties:
        idEquipo:
          type: integer
          example: 1
        idCompeticion:
          type: integer
          description: Identificador de la competición en Escaleta
          example: 10

    Inscripcion:
      type: object
      properties:
        idInscripcion:
          type: integer
          example: 100
        idEquipo:
          type: integer
          example: 1
        idCompeticion:
          type: integer
          example: 10
        fechaInscripcion:
          type: string
          format: date-time
          example: 2026-09-28T17:00:00
        estado:
          type: string
          enum:
            - pendiente_pago
            - confirmada
            - cancelada
          example: pendiente_pago
        idPago:
          type: integer
          nullable: true
          description: Identificador del pago gestionado por Facturación
          example: 450